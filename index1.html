<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title> DJ por una noche</title>
    </head>

<body>
    <h1> DJ por una noche</h1>

    <h2>Cancion actual:</h2>
    <p id="actual"></p>

    <button onclick="siguienteCancion()">Siguiente canción</button>

    <h2>Agregar canción</h2>
    <input type="text" id="nuevaCancion" placeholder="Nombre de la canción">
    <button onclick="agregarCancion()">Agregar</button>

    <button onclick="eliminarCancion()">Eliminar última canción</button>

    <h2>Playlist:</h2>
    <p id="lista"></p>
    <p id="mensaje"></p>

    <script src="js1.js"></script>
</body>
</html>
